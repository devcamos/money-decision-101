name: Production Health

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-health-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  health:
    name: Verify deployed production health
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment_status.target_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Unique *.vercel.app deployment hostnames stay behind Vercel SSO.
      # Probe the public Production alias users actually hit. Do not send
      # VERCEL_AUTOMATION_BYPASS_SECRET here.
      UNIQUE_DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
      PRODUCTION_URL: https://money-decision-101.vercel.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify app and governed policy readiness
        run: |
          test -n "$PRODUCTION_URL"
          echo "Unique deployment URL (SSO-gated, not checked): $UNIQUE_DEPLOYMENT_URL"
          echo "Public Production alias: $PRODUCTION_URL"

          probe="${PRODUCTION_URL%/}/api/health"
          health_file="$(mktemp)"
          http_code="$(curl --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -H "Accept: application/json" \
            -o "$health_file" -w "%{http_code}" \
            "$probe")"

          echo "HTTP $http_code from $probe"
          if [ "$http_code" != "200" ]; then
            echo "Production /api/health must return 200 JSON on the public alias."
            head -c 400 "$health_file" || true
            echo
            exit 1
          fi

          if ! jq empty "$health_file"; then
            echo "Production /api/health was not JSON. Unique deployment URLs return SSO HTML/302; do not treat that as readiness."
            head -c 400 "$health_file" || true
            echo
            exit 1
          fi

          jq -e '
            .status == "ready" and
            .checks.opa.reachable == true and
            .checks.opa.versionMatches == true and
            .checks.opa.policyVersion == .checks.opa.expectedPolicyVersion
          ' "$health_file"

      - name: Verify public production journeys
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: >-
          npx playwright test
          --project=chromium
          --grep "Investing 101 shows UK authority provenance|investing-readiness journey is policy-backed"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
