name: App Build Validation

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/app-build.yml"
  push:
    branches:
      - "feat/money-decision-101-policy"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          OPA_URL: http://127.0.0.1:8181
