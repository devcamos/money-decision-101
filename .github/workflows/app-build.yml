name: Application Quality Gates

on:
  pull_request:
  push:
    branches:
      - "feat/money-decision-101-policy"

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture npm audit report
        run: npm audit --json > npm-audit.json || true

      - name: Enforce no high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Upload dependency governance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-governance
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: error

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Next.js app
        run: npm run build
        env:
          OPA_URL: http://127.0.0.1:8181

  e2e-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: 1.17.0

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start governed OPA policy service
        run: |
          opa run --server --addr=127.0.0.1:8181 policy/money/v1/money_decision.rego policy/money/v1/evidence.json > /tmp/opa.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8181/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/opa.log
          exit 1

      - name: Playwright E2E and compliance tests
        run: npm run test:e2e
        env:
          OPA_URL: http://127.0.0.1:8181

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
